# ==============================================================================
# Netlify Production Configuration for CineBook Frontend
# ==============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Single-Page Application (SPA) Client Routing Rule for React Router v6
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and High-Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable Long-Term Cache for Static Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
