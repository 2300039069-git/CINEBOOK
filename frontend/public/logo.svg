<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cineGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="60%" stop-color="#FF5A36" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ticketGlow" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Cinema Clapper / Ticket Shape -->
  <rect x="4" y="8" width="40" height="32" rx="8" fill="url(#cineGrad)" />
  <rect x="4" y="8" width="40" height="32" rx="8" stroke="url(#ticketGlow)" stroke-width="1.5" />
  
  <!-- Film perforation lines -->
  <circle cx="12" cy="14" r="2.5" fill="#0B0F17" />
  <circle cx="20" cy="14" r="2.5" fill="#0B0F17" />
  <circle cx="28" cy="14" r="2.5" fill="#0B0F17" />
  <circle cx="36" cy="14" r="2.5" fill="#0B0F17" />
  
  <!-- Play/Cinema Star in center -->
  <path d="M21 22L31 28L21 34V22Z" fill="#FFFFFF" />
  
  <!-- Subtle ticket notch cutouts on side -->
  <circle cx="4" cy="24" r="4" fill="#0B0F17" />
  <circle cx="44" cy="24" r="4" fill="#0B0F17" />
</svg>
