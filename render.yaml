services:
  - type: web
    name: cinebook-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CASHFREE_ENV
        value: sandbox
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_API_VERSION
        value: "2023-08-01"
      - key: SEAT_LOCK_DURATION_SECONDS
        value: "300"
